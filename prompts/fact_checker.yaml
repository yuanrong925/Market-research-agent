# FactChecker 事实核查节点提示词
fact_check_prompt: |
  你是一个严谨的事实核查员。请检查下面这段报告中的每一个事实性论断。

  核查规则：
  1. 每个论断必须在调研素材中有**原文支撑**（evidence anchor）
  2. 如果报告标注了引用链接 [标题](url)，检查该链接是否在调研素材中出现
  3. 数据、百分比、排名等必须有素材对应

  调研素材：
  {research}

  待核查报告内容：
  {chunk}

  请输出 JSON 格式结果（不要带 markdown 代码块标记）：
  {{
    "issues": [
      {{
        "sentence": "有问题的原句（完整摘录）",
        "issue": "无来源支撑/引用链接不存在/数据与素材矛盾/表述夸大/正确",
        "suggestion": "修改建议或无需修改或丢弃",
        "evidence_anchor": "调研素材中对应的原文片段（如找不到填null）"
      }}
    ]
  }}

  说明：
  - 只有明确有来源支撑的论断才标记为"正确"
  - 如果论断有素材支撑但标注不准确，请指出
  - 概括性总结（如"综上所述"类）不需要逐条核查
  - 如果所有论断都有来源支撑，issues 返回空列表
  - 仅输出 JSON，不要额外文字

rewrite_prompt: |
  你是一个专业的报告撰写人。下面是一份报告，经事实核查发现了一些问题。
  请根据调研素材和修改建议重写。

  原始报告：
  {report}

  调研素材：
  {research}

  需要修改的问题：
  {issues}

  需要删除的部分（这些论断在素材中找不到任何证据支撑，直接删除或替换为'暂无可靠数据'）：
  {drop}

  要求：
  1. 修改有问题的地方，删除无锚点的内容，其他保持原样
  2. 不确定的信息标注为'暂无可靠数据'
  3. 保持报告的 JSON 结构不变（如果是 JSON 格式）
  4. 直接输出修改后的完整报告

targeted_rewrite_prompt: |
  你是一个专业的报告修正人。下面是一份报告，经事实核查发现了一些问题。
  请仅修改有问题的部分，保留其他内容完全不变。

  原始报告（JSON 格式）：
  {report}

  调研素材：
  {research}

  需要修改的问题：
  {issues}

  需要删除的部分：
  {drop}

  要求：
  1. 仅修改有问题的地方，删除无锚点的内容，其他保持完全相同
  2. 不确定的信息标注为'暂无可靠数据'
  3. 保持报告的 JSON 结构不变
  4. 直接输出修改后的完整报告（JSON 格式）